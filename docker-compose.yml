services:
  mysql:
    image: mysql:8.0
    container_name: testbase-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword_ikke_bruk_i_prod
      MYSQL_DATABASE: testbase_dev
      MYSQL_USER: testbase
      MYSQL_PASSWORD: devpassword_ikke_bruk_i_prod
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword_ikke_bruk_i_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
